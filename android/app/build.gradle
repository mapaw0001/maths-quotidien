plugins {
    id 'com.android.application'
}

def mqCode = (project.findProperty('mqCode') ?: '1').toString().toInteger()
def mqName = (project.findProperty('mqName') ?: '0.0').toString()

android {
    namespace 'io.github.mapaw0001.mathsquotidien'
    compileSdk 34

    defaultConfig {
        applicationId 'io.github.mapaw0001.mathsquotidien'
        minSdk 24
        targetSdk 34
        versionCode mqCode
        versionName mqName
    }

    signingConfigs {
        release {
            if (System.getenv('MQ_KS_FILE')) {
                storeFile file(System.getenv('MQ_KS_FILE'))
                storePassword System.getenv('MQ_KS_PASS')
                keyAlias 'mq'
                keyPassword System.getenv('MQ_KS_PASS')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('MQ_KS_FILE')) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
