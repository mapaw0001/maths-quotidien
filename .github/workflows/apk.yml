name: Fabriquer l'appli Android (APK)

# À chaque mise à jour du site, GitHub fabrique l'appli Android et la publie dans « Releases ».
# L'APK contient seulement la coquille de l'appli : jamais les cours, jamais la clé, jamais le jeton.
# Signature : la clé est créée une seule fois par ce workflow, protégée par le mot de passe que TU as mis dans le secret MQ_KS_PASS
# (Settings > Secrets and variables > Actions). Ce mot de passe n'est connu que de GitHub et de toi.
# Sans ce secret, le workflow vérifie seulement que l'appli se compile (rien n'est publié).

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'tools/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_KS: ${{ secrets.MQ_KS_PASS != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Préparer les fichiers de l'appli
        run: |
          set -e
          A=android/app/src/main/assets/site
          mkdir -p "$A"
          cp -r app fonts icons index.html manifest.webmanifest version.json LICENSE THIRD_PARTY.txt "$A/"
          echo "VER=$(jq -r .version version.json)" >> "$GITHUB_ENV"
          { echo "SDK platforms :"; ls "$ANDROID_HOME/platforms"; echo "build-tools :"; ls "$ANDROID_HOME/build-tools"; echo "fichiers de l'appli :"; find "$A" -type f | wc -l; } | tee build.log

      - name: Compiler (essai, sans clé de signature)
        if: env.HAS_KS != 'true'
        run: |
          set -o pipefail
          gradle -p android --no-daemon "-PmqCode=$(( $(date +%s) / 60 ))" "-PmqName=$VER" assembleDebug 2>&1 | tee -a build.log
          ls -l android/app/build/outputs/apk/debug/ | tee -a build.log

      - name: Clé de signature (créée une seule fois, avec TON mot de passe)
        if: env.HAS_KS == 'true'
        env:
          MQ_KS_PASS: ${{ secrets.MQ_KS_PASS }}
        run: |
          set -e
          if [ "${#MQ_KS_PASS}" -lt 16 ]; then echo "ERREUR : le mot de passe MQ_KS_PASS est trop court (16 signes minimum, 20 conseillés). Change le secret puis relance." | tee -a build.log; exit 1; fi
          if [ ! -f android/signing/mq.p12 ]; then
            mkdir -p android/signing
            keytool -genkeypair -noprompt -keystore android/signing/mq.p12 -storetype PKCS12 -alias mq -keyalg RSA -keysize 4096 -validity 36500 -dname "CN=Maths Quotidien" -storepass:env MQ_KS_PASS -keypass:env MQ_KS_PASS
            git config user.name build
            git config user.email build@users.noreply.github.com
            git add android/signing/mq.p12
            git commit -q -m "Clé de signature de l'appli (protégée par le secret MQ_KS_PASS) [skip ci]"
            git push -q origin HEAD:main
            echo "clé de signature créée et rangée dans le dépôt" | tee -a build.log
          else
            echo "clé de signature déjà présente" | tee -a build.log
          fi

      - name: Compiler et signer
        if: env.HAS_KS == 'true'
        env:
          MQ_KS_PASS: ${{ secrets.MQ_KS_PASS }}
          MQ_KS_FILE: ${{ github.workspace }}/android/signing/mq.p12
        run: |
          set -o pipefail
          gradle -p android --no-daemon "-PmqCode=$(( $(date +%s) / 60 ))" "-PmqName=$VER" assembleRelease 2>&1 | tee -a build.log
          cp android/app/build/outputs/apk/release/app-release.apk maths-quotidien.apk
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$BT/apksigner" verify --print-certs maths-quotidien.apk 2>&1 | tee -a build.log
          ls -l maths-quotidien.apk | tee -a build.log

      - name: Publier l'appli
        if: env.HAS_KS == 'true' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          target_commitish: ${{ github.sha }}
          tag_name: apk-${{ github.run_number }}
          name: Maths Quotidien v${{ env.VER }} (appli Android)
          files: maths-quotidien.apk
          make_latest: true
          body: |
            Appli Android de Maths Quotidien, version ${{ env.VER }}.
            Elle contient seulement la coquille de l'appli : les cours se téléchargent avec le QR code.
            Pour l'installer : télécharge le fichier, ouvre-le, appuie sur Installer.

      - name: Journal du build (pour pouvoir le relire depuis le dépôt)
        if: always()
        env:
          GT: ${{ github.token }}
        run: |
          mkdir -p /tmp/ci
          { echo "build n°$GITHUB_RUN_NUMBER, résultat : ${{ job.status }}, $(date -u +%FT%TZ)"; echo "commit $GITHUB_SHA"; echo "---"; tail -n 400 build.log 2>/dev/null || echo "(pas de journal)"; } > /tmp/ci/journal.txt
          cd /tmp/ci
          git init -q
          git checkout -q -b ci-logs
          git add journal.txt
          git -c user.name=build -c user.email=build@users.noreply.github.com commit -q -m "journal du build $GITHUB_RUN_NUMBER"
          git push -q -f "https://x-access-token:${GT}@github.com/${GITHUB_REPOSITORY}.git" ci-logs
